# Portão de qualidade. Roda em todo push e em todo PR, para que nada chegue
# ao main sem passar pelos testes do motor.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Os testes do motor são a trava clínica: faixa vital, (CONFERIR),
      # validações cruzadas, regras de redação do COREN-SP e a forma da
      # evolução. Falhou aqui, não publica.
      - run: npm test

      - run: npm run typecheck

      - run: npm run build
